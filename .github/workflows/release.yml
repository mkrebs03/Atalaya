name: Release

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.ATALAYA_RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  tailscale-compatibility:
    if: needs['release-please'].outputs.release_created == 'true'
    needs: release-please
    name: Tailscale Serve compatibility (${{ matrix.version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # These are the oldest and newest release endpoints of the supported
        # range. The adapter's semver matrix covers versions between them.
        version: ["1.52.0", "1.99.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs['release-please'].outputs.tag_name }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .tool-versions
          cache-dependency-path: go.sum
      - name: Install Tailscale CLI ${{ matrix.version }}
        env:
          TAILSCALE_VERSION: ${{ matrix.version }}
        run: |
          archive="$RUNNER_TEMP/tailscale-${TAILSCALE_VERSION}.tgz"
          directory="$RUNNER_TEMP/tailscale-${TAILSCALE_VERSION}"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            "https://pkgs.tailscale.com/stable/tailscale_${TAILSCALE_VERSION}_amd64.tgz" \
            --output "$archive"
          mkdir -p "$directory"
          tar -xzf "$archive" -C "$directory"
          tailscale_binary="$(find "$directory" -type f -name tailscale -perm -u+x -print -quit)"
          test -n "$tailscale_binary"
          echo "ATALAYA_TAILSCALE_BIN=$tailscale_binary" >> "$GITHUB_ENV"
          "$tailscale_binary" version
      - name: Exercise Serve adapter
        run: CGO_ENABLED=0 go test ./internal/tailscale -run '^TestServeCompatibilityWithInstalledBinary$' -count=1

  publish-stable:
    if: >-
      needs['release-please'].outputs.release_created == 'true' &&
      needs['tailscale-compatibility'].result == 'success'
    needs:
      - release-please
      - tailscale-compatibility
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.ATALAYA_RELEASE_TOKEN }}
      RELEASE_TAG: ${{ needs['release-please'].outputs.tag_name }}
      RELEASE_VERSION: ${{ needs['release-please'].outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs['release-please'].outputs.tag_name }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .tool-versions
          cache-dependency-path: go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify pinned toolchain
        run: |
          test "$(go env GOVERSION)" = "go1.26.5"
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
      - name: Build release artifacts
        run: make package-release VERSION="$RELEASE_VERSION" PACKAGE_DIR=build/release
      - name: Add operational release notes
        run: |
          schema_version="$(find internal/database/migrations -type f -name '*.sql' | wc -l | tr -d ' ')"
          gh release view "$RELEASE_TAG" --json body --jq '.body' > build/release/RELEASE-NOTES.md
          cat >> build/release/RELEASE-NOTES.md <<EOF

          ## Build and compatibility

          - Linux artifacts: amd64 and arm64.
          - SHA-256 checksums: included in SHA256SUMS.
          - Database schema migrations included: ${schema_version}.
          - Agent protocol: v1.
          - Tailscale Serve compatibility validated against 1.52.0 and 1.99.0.
          - Upgrade must create a backup and run atalaya verify after migration.
          EOF
      - name: Upload stable assets
        run: |
          gh release upload "$RELEASE_TAG" \
            build/release/atalaya-linux-amd64 \
            build/release/atalaya-linux-arm64 \
            build/release/install.sh \
            build/release/SHA256SUMS
      - name: Publish stable release
        run: gh release edit "$RELEASE_TAG" --notes-file build/release/RELEASE-NOTES.md --draft=false

  publish-dev:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: atalaya-dev-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.ATALAYA_RELEASE_TOKEN }}
      CI_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .tool-versions
          cache-dependency-path: go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify pinned toolchain
        run: |
          test "$(go env GOVERSION)" = "go1.26.5"
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
      - name: Calculate dev build identity
        id: metadata
        run: |
          short_sha="$(git rev-parse --short=7 "$CI_SHA")"
          version="0.0.0-dev.${CI_RUN_NUMBER}.${short_sha}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Fetch tags for freshness check
        run: git fetch --force --tags origin
      - name: Skip stale CI result
        id: freshness
        run: |
          current_sha=
          if git show-ref --verify --quiet refs/tags/dev; then
            current_sha="$(git rev-parse refs/tags/dev^{})"
          fi
          publish=true
          if [ -n "$current_sha" ] && [ "$current_sha" != "$CI_SHA" ] && git merge-base --is-ancestor "$CI_SHA" "$current_sha"; then
            publish=false
            echo "dev already points at a newer commit: $current_sha"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Build dev artifacts
        if: steps.freshness.outputs.publish == 'true'
        run: make package-release VERSION="${{ steps.metadata.outputs.version }}" PACKAGE_DIR=build/dev
      - name: Prepare dev release notes
        if: steps.freshness.outputs.publish == 'true'
        run: |
          cat > build/dev/RELEASE-NOTES.md <<EOF
          ## Atalaya dev

          This rolling pre-release is built from commit ${CI_SHA} after the CI workflow completed successfully.

          - Application version: ${{ steps.metadata.outputs.version }}
          - CI run: ${CI_RUN_NUMBER}
          - Linux artifacts: amd64 and arm64.
          - SHA-256 checksums: included in SHA256SUMS.
          - This channel is unstable and must not be used for production data.
          EOF
      - name: Recreate immutable dev release
        if: steps.freshness.outputs.publish == 'true'
        run: |
          tag_ref="repos/${GITHUB_REPOSITORY}/git/refs/tags/dev"
          if gh release view dev >/dev/null 2>&1; then
            # Published releases are immutable. Delete the old release before
            # moving its rolling tag; stable releases remain historical.
            gh release delete dev --yes
          fi
          if git show-ref --verify --quiet refs/tags/dev; then
            updated=false
            for attempt in 1 2 3 4 5; do
              if gh api --method PATCH "$tag_ref" -f sha="$CI_SHA" -F force=true >/dev/null; then
                updated=true
                break
              fi
              if [ "$attempt" -lt 5 ]; then
                sleep 2
              fi
            done
            [ "$updated" = true ]
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref=refs/tags/dev \
              -f sha="$CI_SHA" >/dev/null
          fi
          gh release create dev \
            build/dev/atalaya-linux-amd64 \
            build/dev/atalaya-linux-arm64 \
            build/dev/install.sh \
            build/dev/SHA256SUMS \
            --target "$CI_SHA" \
            --title "Atalaya dev" \
            --notes-file build/dev/RELEASE-NOTES.md \
            --prerelease
