name: Release

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      stable_tag:
        description: Existing stable tag whose draft release should be validated and published
        required: true
        type: string
      stable_version:
        description: SemVer version embedded in the stable artifacts, without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.ATALAYA_RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  tailscale-compatibility:
    if: >-
      always() &&
      (
        needs['release-please'].outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    needs: release-please
    name: Tailscale Serve compatibility (${{ matrix.version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # These are the oldest and newest release endpoints of the supported
        # range. The adapter's semver matrix covers versions between them.
        version: ["1.52.0", "1.98.9"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.stable_tag || needs['release-please'].outputs.tag_name }}
      - name: Use current compatibility harness for recovery
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA" -- internal/tailscale/compatibility_test.go
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .tool-versions
          cache-dependency-path: go.sum
      - name: Install Tailscale CLI ${{ matrix.version }}
        env:
          TAILSCALE_VERSION: ${{ matrix.version }}
        run: |
          archive="$RUNNER_TEMP/tailscale-${TAILSCALE_VERSION}.tgz"
          directory="$RUNNER_TEMP/tailscale-${TAILSCALE_VERSION}"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            "https://pkgs.tailscale.com/stable/tailscale_${TAILSCALE_VERSION}_amd64.tgz" \
            --output "$archive"
          mkdir -p "$directory"
          tar -xzf "$archive" -C "$directory"
          tailscale_binary="$(find "$directory" -type f -name tailscale -perm -u+x -print -quit)"
          test -n "$tailscale_binary"
          echo "ATALAYA_TAILSCALE_BIN=$tailscale_binary" >> "$GITHUB_ENV"
          "$tailscale_binary" version
      - name: Exercise Serve adapter
        run: CGO_ENABLED=0 go test ./internal/tailscale -run '^TestServeCompatibilityWithInstalledBinary$' -count=1

  publish-stable:
    if: >-
      always() &&
      needs['tailscale-compatibility'].result == 'success' &&
      (
        needs['release-please'].outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    needs:
      - release-please
      - tailscale-compatibility
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.ATALAYA_RELEASE_TOKEN }}
      RELEASE_TAG: ${{ inputs.stable_tag || needs['release-please'].outputs.tag_name }}
      RELEASE_VERSION: ${{ inputs.stable_version || needs['release-please'].outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.stable_tag || needs['release-please'].outputs.tag_name }}
      - name: Verify recovery target is a draft release
        if: github.event_name == 'workflow_dispatch'
        run: test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .tool-versions
          cache-dependency-path: go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify pinned toolchain
        run: |
          test "$(go env GOVERSION)" = "go1.26.5"
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
      - name: Build release artifacts
        run: make package-release VERSION="$RELEASE_VERSION" PACKAGE_DIR=build/release
      - name: Add operational release notes
        run: |
          schema_version="$(find internal/database/migrations -type f -name '*.sql' | wc -l | tr -d ' ')"
          gh release view "$RELEASE_TAG" --json body --jq '.body' > build/release/RELEASE-NOTES.md
          cat >> build/release/RELEASE-NOTES.md <<EOF

          ## Build and compatibility

          - Linux artifacts: amd64 and arm64.
          - SHA-256 checksums: included in SHA256SUMS.
          - Database schema migrations included: ${schema_version}.
          - Agent protocol: v1.
          - Tailscale Serve compatibility validated against 1.52.0 and 1.98.9.
          - Upgrade must create a backup and run atalaya verify after migration.
          EOF
      - name: Upload stable assets
        run: |
          gh release upload "$RELEASE_TAG" \
            build/release/atalaya-linux-amd64 \
            build/release/atalaya-linux-arm64 \
            build/release/install.sh \
            build/release/SHA256SUMS
      - name: Publish stable release
        run: gh release edit "$RELEASE_TAG" --notes-file build/release/RELEASE-NOTES.md --draft=false

  publish-dev:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: atalaya-dev-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.ATALAYA_RELEASE_TOKEN }}
      CI_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .tool-versions
          cache-dependency-path: go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify pinned toolchain
        run: |
          test "$(go env GOVERSION)" = "go1.26.5"
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
      - name: Calculate dev build identity
        id: metadata
        run: |
          short_sha="$(git rev-parse --short=7 "$CI_SHA")"
          version="0.0.0-dev.${CI_RUN_NUMBER}.${short_sha}"
          dev_tag="dev-${CI_RUN_NUMBER}-${short_sha}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$dev_tag" >> "$GITHUB_OUTPUT"
      - name: Fetch tags for freshness check
        run: git fetch --force --tags origin
      - name: Skip stale or already published dev result
        id: freshness
        run: |
          latest_tag="$(git tag --list 'dev-[0-9]*-[0-9a-f]*' --sort=-version:refname | head -n 1)"
          current_sha=
          if [ -n "$latest_tag" ]; then
            current_sha="$(git rev-parse "$latest_tag^{commit}")"
          fi
          publish=true
          if [ "$current_sha" = "$CI_SHA" ]; then
            is_draft="$(gh release view "$latest_tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
            if [ "$is_draft" = false ]; then
              publish=false
              echo "dev already published for this commit: $latest_tag"
            fi
          elif [ -n "$current_sha" ] && git merge-base --is-ancestor "$CI_SHA" "$current_sha"; then
            publish=false
            echo "dev already has a newer published build: $latest_tag ($current_sha)"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Build dev artifacts
        if: steps.freshness.outputs.publish == 'true'
        run: make package-release VERSION="${{ steps.metadata.outputs.version }}" PACKAGE_DIR=build/dev
      - name: Prepare dev release notes
        if: steps.freshness.outputs.publish == 'true'
        run: |
          cat > build/dev/RELEASE-NOTES.md <<EOF
          ## Atalaya dev

          This immutable pre-release is built from commit ${CI_SHA} after the CI workflow completed successfully.

          - Application version: ${{ steps.metadata.outputs.version }}
          - CI run: ${CI_RUN_NUMBER}
          - Linux artifacts: amd64 and arm64.
          - SHA-256 checksums: included in SHA256SUMS.
          - This channel is unstable and must not be used for production data.
          EOF
      - name: Publish immutable dev release
        if: steps.freshness.outputs.publish == 'true'
        run: |
          dev_tag="${{ steps.metadata.outputs.tag }}"
          if gh release view "$dev_tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$dev_tag" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != true ]; then
              echo "dev release already published: $dev_tag"
              exit 0
            fi
          else
            gh release create "$dev_tag" \
              --draft \
              --target "$CI_SHA" \
              --title "Atalaya dev ${dev_tag#dev-}" \
              --notes-file build/dev/RELEASE-NOTES.md
          fi
          gh release upload "$dev_tag" \
            build/dev/atalaya-linux-amd64 \
            build/dev/atalaya-linux-arm64 \
            build/dev/install.sh \
            build/dev/SHA256SUMS \
            --clobber
          gh release edit "$dev_tag" --draft=false --prerelease
      - name: Prune old dev releases
        if: steps.freshness.outputs.publish == 'true'
        run: |
          keep=5
          git tag --list 'dev-[0-9]*-[0-9a-f]*' --sort=-version:refname \
            | tail -n "+$((keep + 1))" \
            | while read -r old_tag; do
                echo "pruning $old_tag"
                gh release delete "$old_tag" --yes --cleanup-tag
              done
